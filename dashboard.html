<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cell Analytics | Secure Core Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Space+Grotesk', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 40px;
        }
        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid #dfa638;
            padding-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .stat-card {
            background-color: #1f2833;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #45f3ff;
            box-shadow: 0 4px 15px rgba(69, 243, 255, 0.1);
        }
        .stat-card h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #45f3ff;
        }
        .stat-card p {
            margin: 15px 0 0 0;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
        }
        .visualization-section {
            background-color: #1f2833;
            margin-top: 40px;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #dfa638;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>🚀 E-Cell Live Analytics Panel</h1>
        <p>Real-time registration tracking and department demographics dashboard.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Registrations</h3>
                <p id="total-count">0</p>
            </div>
            <div class="stat-card" style="border-color: #dfa638; box-shadow: 0 4px 15px rgba(223, 166, 56, 0.1);">
                <h3>Target Milestone</h3>
                <p>150</p>
            </div>
        </div>

        <div class="visualization-section">
            <div class="visualization-section">
        <!-- 🚀 PASTE THE LIVE GOAL PROGRESS BAR CODE HERE: -->
        <div style="width: 100%; max-width: 450px; background-color: #1f2833; padding: 20px; border-radius: 12px; border: 1px solid #45f3ff; margin-bottom: 25px; box-sizing: border-box; font-family: sans-serif; box-shadow: 0 4px 15px rgba(69, 243, 255, 0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; font-size: 1rem; color: #45f3ff; text-transform: uppercase; letter-spacing: 1px;">Campaign Progress</h3>
                <span id="progress-text" style="font-size: 0.9rem; font-weight: bold; color: #dfa638;">0% Reached</span>
            </div>
            <div style="width: 100%; background-color: #0b0c10; border-radius: 20px; height: 16px; overflow: hidden; border: 1px solid #45f3ff; padding: 2px; box-sizing: border-box;">
                <div id="progress-fill" style="width: 0%; background: linear-gradient(90deg, #45f3ff 0%, #dfa638 100%); height: 100%; border-radius: 20px; transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1);"></div>
            </div>
        </div>

        <!-- Your existing chart code continues right here: -->
        <h2>Department Representation</h2>
        <div class="chart-container">
            <canvas id="departmentChart"></canvas>
        </div>
    </div>
            <h2>Department Representation</h2>
            <div class="chart-container">
                <canvas id="departmentChart"></canvas>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
