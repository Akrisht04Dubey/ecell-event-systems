<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cell Admin Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Space+Grotesk', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 40px;
        }
        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid #dfa638;
            padding-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .stat-card {
            background-color: #1f2833;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #45f3ff;
            box-shadow: 0 4px 15px rgba(69, 243, 255, 0.1);
        }
        .stat-card h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #45f3ff;
        }
        .stat-card p {
            margin: 15px 0 0 0;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
        }
        .visualization-section {
            background-color: #1f2833;
            margin-top: 40px;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #dfa638;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>🚀 E-Cell Live Analytics Panel</h1>
        <p>Real-time registration tracking and department demographics dashboard.</p>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Registrations</h3>
                <p id="total-count">0</p>
            </div>
            <div class="stat-card" style="border-color: #dfa638; box-shadow: 0 4px 15px rgba(223, 166, 56, 0.1);">
                <h3>Target Milestone</h3>
                <p>150</p>
            </div>
        </div>

        <div class="visualization-section">
            <h2>Department Representation</h2>
            <div class="chart-container">
                <canvas id="departmentChart"></canvas>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
